<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Papercraft World</title>
<meta name="description" content="An interactive low-poly papercraft portfolio world built with three.js." />
<style>
  :root {
    --ink: #4a3f35;
    --paper: #fdf6ec;
    --accent: #e87a5d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #aee3f5;
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---- Intro / loading overlay ---- */
  #intro {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 18px;
    background: radial-gradient(circle at 50% 40%, #fce8d5 0%, #f7c9a8 55%, #e9a17c 100%);
    transition: opacity 0.9s ease;
  }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #intro h1 {
    font-size: clamp(32px, 7vw, 68px); margin: 0; letter-spacing: 1px;
    text-shadow: 2px 3px 0 rgba(255,255,255,0.6);
  }
  #intro p { margin: 0; max-width: 460px; font-size: 15px; line-height: 1.6; opacity: 0.85; padding: 0 20px; }
  #enter {
    margin-top: 8px; padding: 13px 34px; font-size: 16px; font-weight: bold;
    color: var(--paper); background: var(--accent); border: none; border-radius: 40px;
    cursor: pointer; box-shadow: 0 6px 0 #b85a42; transition: transform 0.12s, box-shadow 0.12s;
    font-family: inherit;
  }
  #enter:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #b85a42; }
  #enter:active { transform: translateY(4px); box-shadow: 0 2px 0 #b85a42; }
  #enter:disabled { opacity: 0.6; cursor: default; box-shadow: 0 6px 0 #b85a42; }
  .spinner { width: 26px; height: 26px; border: 3px solid rgba(74,63,53,0.25); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- HUD hint ---- */
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(253,246,236,0.82); backdrop-filter: blur(6px);
    padding: 8px 16px; border-radius: 30px; font-size: 13px;
    border: 1px solid rgba(74,63,53,0.12); box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    opacity: 0; transition: opacity 0.6s ease; pointer-events: none;
  }
  #hint.show { opacity: 1; }

  /* ---- Title badge ---- */
  #badge {
    position: fixed; top: 16px; left: 18px; z-index: 10;
    font-weight: bold; font-size: 18px; opacity: 0;
    text-shadow: 1px 2px 0 rgba(255,255,255,0.55); transition: opacity 0.8s ease;
  }
  #badge.show { opacity: 0.9; }
  #badge span { font-weight: normal; font-size: 12px; opacity: 0.7; display: block; }

  /* ---- Info card popup ---- */
  #card {
    position: fixed; top: 50%; right: 28px; transform: translateY(-50%) translateX(40px); z-index: 30;
    width: min(340px, calc(100vw - 36px)); background: var(--paper);
    border-radius: 16px; padding: 22px 24px 24px; opacity: 0; pointer-events: none;
    box-shadow: 0 18px 50px rgba(0,0,0,0.22); border: 1px solid rgba(74,63,53,0.08);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  #card.show { opacity: 1; pointer-events: auto; transform: translateY(-50%) translateX(0); }
  #card .tag { display: inline-block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    background: var(--accent); color: var(--paper); padding: 3px 10px; border-radius: 20px; margin-bottom: 12px; }
  #card h2 { margin: 0 0 10px; font-size: 22px; }
  #card p { margin: 0 0 14px; font-size: 14px; line-height: 1.6; opacity: 0.85; }
  #card a.link { color: var(--accent); font-weight: bold; text-decoration: none; font-size: 14px; }
  #card a.link:hover { text-decoration: underline; }
  #card .close { position: absolute; top: 12px; right: 14px; cursor: pointer; border: none; background: none;
    font-size: 22px; line-height: 1; color: var(--ink); opacity: 0.5; }
  #card .close:hover { opacity: 1; }
  @media (max-width: 560px) {
    #card { right: 50%; transform: translate(50%, 40px); top: auto; bottom: 70px; }
    #card.show { transform: translate(50%, 0); }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="badge"><span>welcome to</span>Papercraft World</div>

  <div id="card">
    <button class="close" aria-label="Close">&times;</button>
    <span class="tag" id="card-tag">Place</span>
    <h2 id="card-title">Title</h2>
    <p id="card-body">Body text.</p>
    <a class="link" id="card-link" href="#" target="_blank" rel="noopener" style="display:none;">Open &rarr;</a>
  </div>

  <div id="hint">Drag to look around · Scroll to zoom · Click the buildings ✦</div>

  <div id="intro">
    <h1>Papercraft World</h1>
    <p>A tiny handmade island you can explore. Spin it around and click on the little buildings to peek inside.</p>
    <div class="spinner" id="spinner"></div>
    <button id="enter" disabled>Loading…</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./js/world.js"></script>
</body>
</html>
