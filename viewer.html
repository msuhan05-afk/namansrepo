<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive 3D Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #e7e9ee; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    background: rgba(20, 22, 30, 0.7); backdrop-filter: blur(8px);
    padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.45;
    border: 1px solid rgba(255,255,255,0.08); max-width: 280px;
  }
  #hud h1 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
  #hud .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #hud label { opacity: 0.8; min-width: 70px; }
  #hud input[type=range] { flex: 1; }
  #hud button {
    background: #2a3142; color: #e7e9ee; border: 1px solid rgba(255,255,255,0.1);
    padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  #hud button:hover { background: #353d52; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0b0d12; z-index: 20; font-size: 14px; opacity: 0.8;
  }
  #loading.hidden { display: none; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">Loading 3D model…</div>
  <div id="hud">
    <h1>Interactive 3D Model</h1>
    <div style="opacity:0.7;font-size:12px;">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
    <div class="row"><label>Auto-rotate</label><input id="autorotate" type="checkbox" checked /></div>
    <div class="row"><label>Speed</label><input id="speed" type="range" min="0" max="5" step="0.1" value="1" /></div>
    <div class="row"><label>Light</label><input id="light" type="range" min="0" max="3" step="0.05" value="1.1" /></div>
    <div class="row"><label>BG</label>
      <select id="bg" style="flex:1;background:#2a3142;color:#e7e9ee;border:1px solid rgba(255,255,255,0.1);padding:4px;border-radius:6px;">
        <option value="#0b0d12">Dark</option>
        <option value="#1a1f2e">Slate</option>
        <option value="#f3f4f6">Light</option>
        <option value="#000000">Black</option>
      </select>
    </div>
    <div class="row"><button id="reset">Reset view</button><button id="wire">Wireframe</button></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const container = document.getElementById('app');
    const loadingEl = document.getElementById('loading');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0b0d12');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(2, 1.5, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const hemi = new THREE.HemisphereLight(0xffffff, 0x222233, 0.6);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(5, 8, 5);
    scene.add(dir);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0;

    let model = null;
    let initialCamPos = camera.position.clone();
    let initialTarget = new THREE.Vector3(0, 0, 0);
    let wireframeOn = false;

    const loader = new GLTFLoader();
    loader.load(
      'models/model.glb',
      (gltf) => {
        model = gltf.scene;

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3()).length();
        const center = box.getCenter(new THREE.Vector3());

        model.position.sub(center);
        scene.add(model);

        const dist = size * 1.2;
        camera.position.set(dist, dist * 0.6, dist);
        camera.near = size / 100;
        camera.far = size * 100;
        camera.updateProjectionMatrix();

        controls.target.set(0, 0, 0);
        controls.maxDistance = size * 5;
        controls.minDistance = size * 0.1;
        controls.update();

        initialCamPos = camera.position.clone();
        initialTarget = controls.target.clone();

        loadingEl.classList.add('hidden');
      },
      (xhr) => {
        if (xhr.total) {
          const pct = Math.round((xhr.loaded / xhr.total) * 100);
          loadingEl.textContent = `Loading 3D model… ${pct}%`;
        }
      },
      (err) => {
        loadingEl.textContent = 'Failed to load model.';
        console.error(err);
      }
    );

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.getElementById('autorotate').addEventListener('change', (e) => {
      controls.autoRotate = e.target.checked;
    });
    document.getElementById('speed').addEventListener('input', (e) => {
      controls.autoRotateSpeed = parseFloat(e.target.value);
    });
    document.getElementById('light').addEventListener('input', (e) => {
      renderer.toneMappingExposure = parseFloat(e.target.value);
    });
    document.getElementById('bg').addEventListener('change', (e) => {
      scene.background = new THREE.Color(e.target.value);
    });
    document.getElementById('reset').addEventListener('click', () => {
      camera.position.copy(initialCamPos);
      controls.target.copy(initialTarget);
      controls.update();
    });
    document.getElementById('wire').addEventListener('click', () => {
      if (!model) return;
      wireframeOn = !wireframeOn;
      model.traverse((o) => {
        if (o.isMesh && o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach((m) => { m.wireframe = wireframeOn; });
        }
      });
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
