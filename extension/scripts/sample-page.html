<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aurora — Project Management, Reimagined</title>
    <style>
      :root { --brand: #4f46e5; --brand-2: #ec4899; }
      body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: #0f172a; background: #ffffff; }
      header { background: #0f172a; color: #f8fafc; padding: 24px 40px; }
      header a { color: #cbd5e1; }
      h1 { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 44px; color: #111827; }
      h2 { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 28px; color: #1e293b; }
      p { font-size: 17px; line-height: 1.6; color: #334155; }
      .hero { padding: 80px 40px; background: linear-gradient(120deg,#eef2ff,#fdf2f8); }
      .btn-primary { background: #4f46e5; color: #ffffff; border: none; border-radius: 10px; padding: 12px 24px; font-weight: 600; font-size: 16px; box-shadow: 0 4px 14px rgba(79,70,229,.4); }
      .btn-secondary { background: #ffffff; color: #4f46e5; border: 1px solid #c7d2fe; border-radius: 10px; padding: 12px 24px; font-weight: 600; font-size: 16px; }
      .btn-accent { background: #ec4899; color: #ffffff; border: none; border-radius: 999px; padding: 10px 20px; font-weight: 700; font-size: 14px; }
      .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; color: #475569; }
      footer { background: #111827; color: #94a3b8; padding: 40px; }
    </style>
  </head>
  <body>
    <header>
      <nav><a href="#">Product</a> <a href="#">Pricing</a> <a href="#">Docs</a></nav>
    </header>
    <section class="hero">
      <h1>Plan less. Ship more.</h1>
      <p>Aurora keeps your team in flow with a calm, focused workspace.</p>
      <button class="btn-primary">Get started</button>
      <button class="btn-secondary">Live demo</button>
      <button class="btn-accent">New</button>
      <button class="btn-primary">Sign up free</button>
    </section>
    <main>
      <section>
        <h2>Why teams choose Aurora</h2>
        <div class="card"><h2>Fast</h2><p>Blazing quick boards.</p></div>
        <div class="card"><p>Built for focus and clarity across every project.</p></div>
        <button class="btn-secondary">Learn more</button>
      </section>
    </main>
    <footer><p>© 2026 Aurora Inc.</p></footer>
  </body>
</html>
