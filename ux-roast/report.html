<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UX Roast — Report</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="report.css" />
</head>
<body>
  <div id="empty" class="empty hidden">
    <img src="icons/icon-128.png" width="64" height="64" alt="" />
    <h1>No report yet</h1>
    <p>Open the UX Roast extension on any website and hit <strong>Roast this page</strong>.</p>
  </div>

  <div id="report" class="report hidden">
    <!-- Sticky toolbar (hidden in print) -->
    <div class="toolbar no-print">
      <div class="toolbar-brand">
        <img src="icons/icon-32.png" width="20" height="20" alt="" />
        <strong>UX&nbsp;Roast</strong>
      </div>
      <div class="toolbar-actions">
        <button id="export-pdf" class="btn btn-primary">Export PDF</button>
      </div>
    </div>

    <main class="sheet">
      <!-- Cover -->
      <header class="cover">
        <div class="cover-left">
          <p class="kicker">UX Audit Report</p>
          <h1 id="page-title" class="cover-title"></h1>
          <a id="page-url" class="cover-url" target="_blank" rel="noopener"></a>
          <p id="meta" class="cover-meta"></p>
          <p id="verdict" class="cover-verdict"></p>
          <div id="counts" class="count-row"></div>
        </div>
        <div class="cover-score">
          <div class="gauge">
            <svg viewBox="0 0 120 120" class="gauge-svg">
              <circle class="gauge-track" cx="60" cy="60" r="52" />
              <circle class="gauge-fill" id="gauge-fill" cx="60" cy="60" r="52" />
            </svg>
            <div class="gauge-center">
              <span class="gauge-score" id="score">–</span>
              <span class="gauge-grade" id="grade"></span>
            </div>
          </div>
          <p class="gauge-cap">UX Score / 100</p>
        </div>
      </header>

      <!-- Category scores -->
      <section class="block">
        <h2 class="block-title">Category breakdown</h2>
        <div id="cats" class="cat-grid"></div>
      </section>

      <!-- Screenshot -->
      <section class="block" id="shot-block">
        <h2 class="block-title">Captured page</h2>
        <div class="shot-frame"><img id="shot" alt="Screenshot of the analyzed page" /></div>
      </section>

      <!-- Recommendations -->
      <section class="block">
        <h2 class="block-title">Recommendations</h2>
        <p class="block-sub">Prioritised by impact. Tackle critical issues first.</p>
        <div id="recs"></div>
      </section>

      <!-- Detailed findings per category -->
      <section class="block">
        <h2 class="block-title">Detailed findings</h2>
        <div id="details"></div>
      </section>

      <footer class="report-footer">
        Generated by UX Roast · <span id="footer-date"></span>
      </footer>
    </main>
  </div>

  <script src="browser-api.js"></script>
  <script src="report.js"></script>
</body>
</html>
