<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Desk Scene — Interactive 3D</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Helvetica Neue", system-ui, sans-serif;
    background: linear-gradient(135deg, #f6efe6 0%, #ece2d2 100%);
    color: #2b2b2b; overflow-x: hidden;
  }
  header { padding: 40px 24px 10px; text-align: center; }
  header h1 { margin: 0; font-weight: 300; letter-spacing: 4px; font-size: 28px; }
  header p { margin: 6px 0 0; opacity: 0.6; font-size: 13px; letter-spacing: 1px; }

  .desk {
    position: relative; width: min(900px, 96vw); margin: 30px auto 60px;
    aspect-ratio: 4/5;
    background: linear-gradient(160deg, #f4ece0, #e6dac5);
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(80,60,30,0.18), inset 0 0 80px rgba(255,255,255,0.4);
  }

  /* green cutting mat */
  .mat {
    position: absolute; left: 8%; top: 22%; width: 84%; height: 70%;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,0.18) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,0.18) 39px 40px),
      linear-gradient(160deg, #2f7d4f, #1f5a39);
    transform: perspective(900px) rotateX(6deg) rotate(-2deg);
    border-radius: 6px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }

  /* viewer in center on the mat */
  .viewer-wrap {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 60%; aspect-ratio: 1/1; z-index: 5;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  }
  .viewer-wrap iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }

  /* 2D decorations */
  .deco { position: absolute; }
  .plant {
    left: 8%; top: 4%; width: 110px; height: 110px;
    background: radial-gradient(circle at 50% 55%, #6cbf6c 0%, #4ca34c 40%, #2f7a2f 75%);
    border-radius: 50%;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18), inset -10px -10px 25px rgba(0,0,0,0.25);
  }
  .plant::before {
    content: ""; position: absolute; left: 12%; top: 78%; width: 76%; height: 38px;
    background: linear-gradient(180deg, #f3b5c7, #d68aa0);
    border-radius: 0 0 40px 40px / 0 0 24px 24px;
    box-shadow: 0 10px 18px rgba(0,0,0,0.18);
  }

  .laptop {
    right: -4%; top: -4%; width: 55%; height: 30%;
    background: linear-gradient(160deg, #c7ccd1, #9aa1a8);
    border-radius: 12px;
    transform: rotate(8deg);
    box-shadow: 0 14px 30px rgba(0,0,0,0.2);
  }
  .laptop::after {
    content: ""; position: absolute; inset: 10% 8% 18% 8%;
    background:
      repeating-linear-gradient(0deg, #3a3f45 0 14px, #4a5058 14px 16px),
      repeating-linear-gradient(90deg, transparent 0 22px, rgba(255,255,255,0.05) 22px 24px);
    border-radius: 6px;
  }

  .stickynote {
    right: 6%; top: 26%; width: 110px; height: 110px;
    background: linear-gradient(180deg, #ffe177, #f5cf4d);
    transform: rotate(-6deg);
    box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    font-family: "Comic Sans MS", cursive; font-size: 10px; padding: 10px;
    color: #5a4a10; line-height: 1.4;
  }
  .stickynote::before {
    content: "∫ f(x)dx\nE = mc²\nx² + y² = r²\n→ 3D ✦";
    white-space: pre;
  }

  .stapler {
    left: 2%; top: 30%; width: 110px; height: 36px;
    background: linear-gradient(180deg, #6f8bd6, #4a66b8);
    border-radius: 30px 30px 8px 8px / 18px 18px 8px 8px;
    transform: rotate(-20deg);
    box-shadow: 0 10px 18px rgba(0,0,0,0.2);
  }

  .punch {
    left: 4%; top: 14%; width: 80px; height: 50px;
    background: linear-gradient(180deg, #b8bdc4, #7e848d);
    border-radius: 8px;
    transform: rotate(15deg);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }
  .punch::after {
    content: "6:55"; position: absolute; left: 8px; bottom: 6px;
    font-family: "Courier New", monospace; font-weight: bold;
    color: #fff; font-size: 14px; letter-spacing: 2px;
    text-shadow: 0 0 4px #fff;
  }

  .clips { right: 4%; top: 50%; width: 60px; height: 50px; }
  .clips::before, .clips::after {
    content: ""; position: absolute; width: 38px; height: 14px;
    border: 3px solid #6bb56b; border-radius: 8px; background: transparent;
  }
  .clips::before { top: 6px; left: 10px; transform: rotate(12deg); }
  .clips::after  { top: 26px; left: 4px; transform: rotate(-8deg); }

  .pencil {
    left: 22%; bottom: 14%; width: 12px; height: 180px;
    background: linear-gradient(180deg, #ff6b4a 0%, #ff6b4a 8%, #f5c84a 8%, #f5c84a 92%, #2b2b2b 92%);
    border-radius: 3px; transform: rotate(20deg);
    box-shadow: 4px 4px 10px rgba(0,0,0,0.2);
  }
  .pencil.two { left: 28%; bottom: 12%; transform: rotate(28deg); }

  .eraser {
    left: 12%; bottom: 22%; width: 44px; height: 22px;
    background: #e94e3b; border-radius: 3px; transform: rotate(-10deg);
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
  }

  .mug {
    right: 8%; bottom: 6%; width: 90px; height: 70px;
    background: linear-gradient(180deg, #d48ea1, #a86578);
    border-radius: 8px 8px 40px 40px / 8px 8px 30px 30px;
    box-shadow: 0 12px 22px rgba(0,0,0,0.22);
  }
  .mug::after {
    content: ""; position: absolute; right: -16px; top: 14px;
    width: 22px; height: 30px;
    border: 6px solid #a86578; border-left: 0;
    border-radius: 0 18px 18px 0;
  }

  .paper {
    left: -2%; bottom: -2%; width: 28%; height: 24%;
    background: #f9f6ee; transform: rotate(-8deg);
    box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    padding: 10px; font-size: 8px; color: #5a5240;
    line-height: 1.4; overflow: hidden;
  }
  .paper::before {
    content: "Lorem ipsum dolor sit amet\nconsectetur adipiscing elit\nsed do eiusmod tempor\nincididunt ut labore et\ndolore magna aliqua\nUt enim ad minim veniam";
    white-space: pre;
  }

  footer {
    text-align: center; padding: 0 20px 40px; opacity: 0.55; font-size: 12px; letter-spacing: 1px;
  }
  footer a { color: inherit; }

  @media (max-width: 600px) {
    .plant { width: 70px; height: 70px; }
    .stickynote { width: 80px; height: 80px; font-size: 8px; }
    .punch, .stapler, .clips, .mug { transform: scale(0.7) rotate(var(--r, 0deg)); }
    header h1 { font-size: 20px; letter-spacing: 2px; }
  }
</style>
</head>
<body>
  <header>
    <h1>WORKSPACE / 3D</h1>
    <p>drag · zoom · explore</p>
  </header>

  <div class="desk">
    <div class="deco laptop"></div>
    <div class="deco plant"></div>
    <div class="deco punch"></div>
    <div class="deco stapler"></div>
    <div class="deco stickynote"></div>
    <div class="deco clips"></div>
    <div class="mat"></div>
    <div class="deco eraser"></div>
    <div class="deco pencil"></div>
    <div class="deco pencil two"></div>
    <div class="deco mug"></div>
    <div class="deco paper"></div>

    <div class="viewer-wrap">
      <iframe src="index.html" title="3D Model"></iframe>
    </div>
  </div>

  <footer>made with three.js · <a href="index.html">open viewer fullscreen</a></footer>
</body>
</html>
